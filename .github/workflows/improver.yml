name: improver

# Inward self-improvement loop (§8). Reads learning-proposals, runs sampled
# interrogations, applies edits, runs the evals to confirm no regression, and
# opens ONE reviewed PR. Never auto-merges.
#
# Auth: runs on a Claude subscription via CLAUDE_CODE_OAUTH_TOKEN (no Anthropic
# API credits needed). Generate it once with `claude setup-token` and add it as
# the repo secret CLAUDE_CODE_OAUTH_TOKEN. (Alternatively set ANTHROPIC_API_KEY
# if you prefer pay-as-you-go API billing.) If you'd rather not use Actions at
# all, run /swarm:improve from a scheduled Claude routine instead — see the README.

on:
  schedule:
    - cron: "0 7 * * *" # nightly 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  improver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the Improver
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude -p "You are the Improver agent for this repo. Follow plugins/swarm/agents/improver.md exactly:
          read open learning-proposal issues and .swarm/run-log.jsonl, run sampled interrogations,
          apply the smallest correct edits via promote-learning, then run
          'python3 knowledge/evals/run.py --llm' and confirm NO regression.
          Group related changes into ONE branch, bump plugins/swarm/.claude-plugin/plugin.json version,
          and open a single PR labeled 'meta' linking the proposals it resolves. Do NOT merge it." \
            --permission-mode acceptEdits \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash"

      - name: Guard — verify nothing was auto-merged
        run: echo "Improver opens PRs only; merges are human. (no-op guard step)"
